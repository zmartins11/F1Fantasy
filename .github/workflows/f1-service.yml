name: F1 Service CI

on:
  push:
    branches:
      - off-season
    paths:
      - 'f1-service/**'
      - '.github/workflows/f1-service.yml'

  pull_request:
    branches:
      - off-season
    paths:
      - 'f1-service/**'
      - '.github/workflows/f1-service.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./f1-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: f1-service/pom.xml

      - name: Build and run tests
        run: mvn --batch-mode clean verify