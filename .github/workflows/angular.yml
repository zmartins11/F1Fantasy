
name: Angular CI

on:
  push:
    branches:
      - off-season
    paths:
      - 'fantasyAngular/**'
      - '.github/workflows/angular.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'fantasyAngular/**'
      - '.github/workflows/angular.yml'
      - '.github/workflows/angular-deploy.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fantasyAngular/fantasyAngular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: fantasyAngular/fantasyAngular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production
