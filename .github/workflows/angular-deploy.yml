name: Angular CD

on:
  push:
    branches:
      - master
    paths:
      - 'fantasyAngular/**'
      - '.github/workflows/angular-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./fantasyAngular/fantasyAngular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: fantasyAngular/fantasyAngular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build fantasyAngular --configuration production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/549511174259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@f1-fantasy-510117.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project f1-fantasy-510117 --non-interactive