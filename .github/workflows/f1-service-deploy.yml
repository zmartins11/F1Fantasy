
name: F1 Service CD

on:
  push:
    branches:
      - master
    paths:
      - 'f1-service/**'
      - '.github/workflows/f1-service-deploy.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: f1-service/pom.xml

      - name: Build and test
        working-directory: ./f1-service
        run: mvn --batch-mode clean verify

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/549511174259/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@f1-fantasy-510117.iam.gserviceaccount.com'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t europe-west1-docker.pkg.dev/f1-fantasy-510117/f1-fantasy/f1-service:${{ github.sha }} \
            ./f1-service

      - name: Push Docker image
        run: |
          docker push europe-west1-docker.pkg.dev/f1-fantasy-510117/f1-fantasy/f1-service:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy f1-service \
            --image europe-west1-docker.pkg.dev/f1-fantasy-510117/f1-fantasy/f1-service:${{ github.sha }} \
            --region europe-west1 \
            --project f1-fantasy-510117 \
            --quiet
