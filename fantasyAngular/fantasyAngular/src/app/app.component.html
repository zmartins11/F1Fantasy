<div id="app" class="app-shell">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">F1</div>
      <div>
        <a routerLink="/" class="brand-title">F1Predictor</a>
        <p class="brand-tagline">Race insights, predictions and weather for every weekend.</p>
      </div>
    </div>

    <nav class="app-nav">
      <a routerLink="/calendar" routerLinkActive="active" *ngIf="checkLogin()">Calendar</a>
      <a routerLink="/admin" routerLinkActive="active" *ngIf="showAdminBoard">Admin</a>
      <a routerLink="/mod" routerLinkActive="active" *ngIf="showModeratorBoard">Moderator</a>
      <a routerLink="/profile" *ngIf="checkLogin()">{{ getUsername() }}</a>
    </nav>

    <div class="app-actions">
      <a routerLink="/register" *ngIf="!checkLogin()">Sign Up</a>
      <a routerLink="/login" *ngIf="!checkLogin()">Login</a>
      <button type="button" class="logout-button" *ngIf="checkLogin()" (click)="logout()">Logout</button>
    </div>
  </header>

  <main class="app-content container mb-5">
    <router-outlet></router-outlet>
    <app-spinner></app-spinner>
  </main>

  <footer class="app-footer">
    <div class="footer-row">
      <span>© 2024 F1Predictor</span>
      <div class="footer-links">
        <a routerLink="/">Home</a>
        <a routerLink="/calendar">Calendar</a>
      </div>
    </div>
  </footer>
</div>
