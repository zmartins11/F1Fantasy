<div class="auth-root">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="assets/images/logo.png" alt="F1 Fantasy" class="brand-logo" onerror="this.style.display='none'" />
            <h3>Create your account</h3>
        </div>

        <form *ngIf="!isSuccessful" name="form" (ngSubmit)="f.form.valid && onSubmit()" #f="ngForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control modern-input" name="username" [(ngModel)]="form.username" required minlength="3" maxlength="20" #username="ngModel" />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" class="form-control modern-input" name="email" [(ngModel)]="form.email" required email #email="ngModel" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control modern-input" name="password" [(ngModel)]="form.password" required minlength="6" #password="ngModel" />
            </div>

            <div class="form-group form-actions">
                <button class="btn btn-primary btn-block btn-modern">Create account</button>
            </div>

            <div class="form-meta">
                <a routerLink="/login" class="link-muted">Already have an account? Sign in</a>
            </div>

            <div class="form-error" *ngIf="f.submitted && isSignUpFailed">
                <div class="alert alert-warning">Signup failed!<br />{{ errorMessage }}</div>
            </div>
        </form>

        <div class="alert alert-success" *ngIf="isSuccessful">Your registration is successful!</div>
    </div>
</div>
