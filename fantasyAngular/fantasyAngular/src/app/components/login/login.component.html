<div class="auth-root">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="assets/images/logo.png" alt="F1 Fantasy" class="brand-logo" onerror="this.style.display='none'" />
            <h3>F1 Fantasy</h3>
        </div>

        <form *ngIf="!isLoggedIn" name="form" (ngSubmit)="onSubmit()" #f="ngForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control modern-input" name="username" [(ngModel)]="form.username" required #username="ngModel" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control modern-input" name="password" [(ngModel)]="form.password" required minlength="6" #password="ngModel" />
            </div>

            <div class="form-group form-actions">
                <button class="btn btn-primary btn-block btn-modern">Login</button>
            </div>

            <div class="form-meta">
                <a routerLink="/register" class="link-muted">Create an account</a>
                <span class="separator">•</span>
                <a routerLink="/" class="link-muted">Back to home</a>
            </div>

            <div class="form-error" *ngIf="f.submitted && isLoginFailed">
                <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
            </div>
        </form>

        <div *ngIf="isLoggedIn" class="alert alert-success mt-3" role="alert">Logged in as {{ roles }}</div>
    </div>
</div>
