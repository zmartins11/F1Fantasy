spring.application.name=api-gateway

spring.config.import=optional:file:../.env[.properties]

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=f1-service
spring.cloud.gateway.server.webflux.routes[1].uri=${F1_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/f1/**

spring.cloud.gateway.server.webflux.routes[2].id=predict-service
spring.cloud.gateway.server.webflux.routes[2].uri=${PREDICT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/predictions/**

spring.cloud.gateway.server.webflux.routes[3].id=scoring-service
spring.cloud.gateway.server.webflux.routes[3].uri=${SCORING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/scoring/**
